<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giovanna Mastelari</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Playfair Display', serif;
      background-color: #fff;
      color: #222;
    }

    /* ---------- HEADER ---------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    nav a {
      margin-left: 30px;
      text-decoration: none;
      color: #222;
      font-weight: 500;
    }

    /* ---------- HERO ---------- */
    .hero {
      min-height: 90vh;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 4rem;
      padding: 6rem 8%;
      background-color: #fff;
    }

    .hero-text h2 {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .hero-text p {
      font-size: 16px;
      line-height: 1.8;
      max-width: 480px;
      color: #444;
    }

    .hero-image img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 4rem 6%;
      }

      .hero-image {
        order: -1;
        margin-bottom: 30px;
      }

      .hero-text h2 {
        font-size: 32px;
      }
    }

    /* ---------- PAGES ---------- */
    .page {
      display: none;
      padding: 60px;
      font-size: 24px;
      text-align: center;
    }

    /* ---------- BLOG ---------- */
    .blog-list {
      max-width: 800px;
      margin: 40px auto 0;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .blog-item {
      border: 1px solid #eee;
      padding: 25px 30px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .blog-item:hover {
      background-color: #f9f9f9;
    }

    .blog-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .blog-preview {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    .blog-read {
      font-size: 12px;
      color: #888;
    }

    /* ---------- CONTACT ---------- */
    .contact-form {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .contact-form .form-row {
      display: flex;
      gap: 10px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      font-size: 14px;
      font-family: 'Playfair Display', serif;
    }

    .contact-form button {
      padding: 10px 20px;
      background-color: #222;
      color: white;
      border: none;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
    }

    .contact-form button:hover {
      background-color: #444;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Giovanna Mastelari</h1>
    <nav>
      <a href="#" onclick="showPage('home')">home</a>
      <a href="#" onclick="showPage('about')">about me</a>
      <a href="#" onclick="showPage('services')">services</a>
      <a href="#" onclick="showPage('contact')">contact me</a>
      <a href="#" onclick="showPage('blog')">blog</a>
    </nav>
  </header>

  <!-- HOME -->
  <div id="home" class="hero">
    <div class="hero-text">
      <h2>Building Technology With Intention</h2>
      <p>
        I am a software engineer, researcher, and founder focused on building intelligent systems and products that are human-centered, community-driven, and impact-oriented.
      </p>
    </div>

    <div class="hero-image">
      <img src="your-photo.jpg" alt="Giovanna Mastelari speaking">
    </div>
  </div>

  <!-- ABOUT -->
  <div id="about" class="page">
    <!-- your existing about content unchanged -->
  </div>

  <!-- SERVICES -->
  <div id="services" class="page">
    <!-- your existing services content unchanged -->
  </div>

  <!-- CONTACT -->
  <div id="contact" class="page">
    <!-- your existing contact form unchanged -->
  </div>

  <!-- BLOG -->
  <div id="blog" class="page">
    <!-- your existing blog content unchanged -->
  </div>

  <!-- SCRIPT -->
  <script>
    function showPage(pageId) {
      const pages = document.querySelectorAll('.page');
      const hero = document.getElementById('home');

      pages.forEach(p => p.style.display = 'none');
      hero.style.display = (pageId === 'home') ? 'grid' : 'none';

      if (pageId !== 'home') {
        document.getElementById(pageId).style.display = 'block';
      }
    }
  </script>

</body>
</html>
